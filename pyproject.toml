[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawlet"
version = "0.6.0a8"
description = "A lightweight AI agent framework with identity awareness"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Clawlet Team"}
]
keywords = ["ai", "agent", "llm", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core (lightweight, always needed)
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "loguru>=0.7.0",
    "httpx>=0.25.0",
    "aiohttp>=3.8.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=1.10.0",
    "croniter>=1.4.0",
    "aiosqlite>=0.19.0",
    "textual>=0.76.0",
]

[project.optional-dependencies]
monitoring = [
    "psutil>=5.9.0",
]
# v2: heavy backends are opt-in (lazy-installed). Local-only agents skip ~200MB.
channels-telegram = ["python-telegram-bot>=21.11.1,<22"]
channels-discord = ["discord.py>=2.3.0"]
channels-slack = ["slack_bolt>=1.18.0"]
channels = [
    "clawlet[channels-telegram,channels-discord,channels-slack]",
]
storage-postgres = ["asyncpg>=0.29.0"]
tui = ["textual>=0.76.0"]
full = [
    "clawlet[channels,storage-postgres,tui,monitoring]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
clawlet = "clawlet.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawlet*"]

[tool.setuptools.package-data]
clawlet = ["py.typed"]
"clawlet.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests", "clawlet/tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that touch cross-component or external boundaries",
]
